<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 2026 | AI Career Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gemini: {
                            bg: '#131314',
                            sidebar: '#1e1f20',
                            surface: '#1e1f20',
                            hover: '#2a2b2c',
                            accent: '#8ab4f8',
                            text: '#e3e3e3',
                            muted: '#9aa0a6',
                            border: '#333537',
                            lightBg: '#ffffff',
                            lightSidebar: '#f8fafd',
                            lightText: '#1f1f1f'
                        }
                    },
                    boxShadow: {
                        '3xl': '0 35px 60px -15px rgba(0, 0, 0, 0.6)',
                        'inner-glass': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.05)',
                    },
                    animation: {
                        'gradient-x': 'gradient-x 15s ease infinite',
                        'pulse-subtle': 'pulse-subtle 3s infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        'gradient-x': {
                            '0%, 100%': { 'background-position': '0% 50%' },
                            '50%': { 'background-position': '100% 50%' },
                        },
                        'pulse-subtle': {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.8' },
                        },
                        'float': {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@300;400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        h1, h2, .google-sans { font-family: 'Google Sans', 'Inter', sans-serif; }
        
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .dark .glass {
            background: rgba(22, 22, 26, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .light-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .gemini-gradient {
            background: linear-gradient(-45deg, #4285f4, #9b72cb, #d96570, #4285f4);
            background-size: 400% 400%;
            animation: gradient-x 10s ease infinite;
        }
    </style>
</head>
<body class="dark bg-gemini-lightBg dark:bg-gemini-bg text-gemini-lightText dark:text-gemini-text h-full overflow-hidden transition-colors duration-500">
    
    <!-- Background Sparkles/Aura -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-blue-500/5 dark:bg-blue-500/10 blur-[120px] rounded-full animate-float"></div>
        <div class="absolute top-[40%] -right-[10%] w-[30%] h-[50%] bg-purple-500/5 dark:bg-purple-500/10 blur-[120px] rounded-full animate-float" style="animation-delay: -2s;"></div>
    </div>

    <!-- Floating Toggle Button -->
    <button id="toggle-sidebar" class="fixed top-4 left-4 md:top-6 md:left-6 z-[110] p-3 hover:bg-black/5 dark:hover:bg-white/5 rounded-full text-gray-600 dark:text-gray-300 transition-all duration-300">
        <i class="fas fa-bars text-xl"></i>
    </button>

    <div class="flex h-full w-full overflow-hidden relative z-10">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed top-0 left-0 h-full w-72 bg-gemini-lightSidebar dark:bg-gemini-sidebar transition-transform duration-500 flex flex-col z-[100] -translate-x-full shadow-2xl border-r border-gray-200 dark:border-gemini-border/30">
            <!-- Sidebar Header with close icon -->
            <div class="p-6 flex items-center justify-end">
                <button id="close-sidebar" class="p-2 hover:bg-black/5 dark:hover:bg-white/5 rounded-full text-gray-500 transition-all">
                    <i class="fas fa-times text-lg"></i>
                </button>
            </div>

            <!-- New Chat Button -->
            <div class="px-4 mb-6">
                <button id="new-chat-btn" class="w-full flex items-center gap-3 px-5 py-3.5 bg-blue-50 dark:bg-blue-900/20 hover:bg-blue-100 dark:hover:bg-blue-900/40 rounded-full transition-all group overflow-hidden">
                    <i class="fas fa-plus text-lg text-blue-600 dark:text-blue-400 group-hover:rotate-90 transition-transform duration-300"></i>
                    <span class="text-blue-700 dark:text-blue-300 font-medium whitespace-nowrap">Percakapan Baru</span>
                </button>
            </div>

            <!-- Chat History -->
            <div class="flex-1 overflow-y-auto px-4 space-y-6 no-scrollbar">
                <div class="sidebar-text">
                    <h3 class="px-3 mb-3 text-xs font-semibold text-gray-500 dark:text-gray-400">Riwayat</h3>
                    <div id="chat-history-list" class="space-y-1">
                        <!-- Recent items -->
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col relative min-w-0 bg-transparent overflow-hidden">
            <!-- Header -->
            <header class="flex items-center justify-between p-4 md:px-8 md:py-6 relative z-20">
                <div class="flex items-center gap-4 pl-12 md:pl-14">
                    <div class="flex items-center gap-2 cursor-pointer select-none">
                        <span class="google-sans font-medium text-xl text-gray-800 dark:text-gray-200">Gemini</span>
                        <span class="text-blue-500 text-[13px] font-semibold tracking-wide">2026</span>
                    </div>
                </div>
                
                <div class="flex items-center gap-4">
                    <button id="settings-btn" class="p-3 bg-white dark:bg-gemini-surface rounded-full shadow-sm hover:scale-105 active:scale-95 transition-all" title="Setelan">
                        <i class="fas fa-cog text-gray-600 dark:text-gray-300"></i>
                    </button>
                    <button id="theme-toggle" class="p-3 bg-white dark:bg-gemini-surface rounded-full shadow-sm hover:scale-105 active:scale-95 transition-all" title="Ganti Tema">
                        <i class="fas fa-moon dark:hidden"></i>
                        <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
                    </button>
                    <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-400 to-purple-600 flex items-center justify-center text-white text-xs font-bold shadow-lg">U</div>
                </div>
            </header>

            <!-- Chat Container -->
            <div id="chat-messages" class="flex-1 overflow-y-auto px-4 md:px-12 pb-48 pt-4 scroll-smooth no-scrollbar">
                <!-- Welcome Screen -->
                <div id="welcome-screen" class="max-w-4xl mx-auto mt-20 md:mt-32">
                    <div class="space-y-6 text-center md:text-left mb-16">
                        <h1 class="text-5xl md:text-7xl font-bold google-sans tracking-tight bg-gradient-to-r from-blue-500 via-purple-500 to-red-400 bg-clip-text text-transparent">
                            Halo, Pengguna.
                        </h1>
                        <p class="text-xl md:text-2xl font-medium text-gray-400 dark:text-gray-500 max-w-2xl leading-relaxed">
                            Apa yang ingin Anda buat hari ini?
                        </p>
                    </div>

                    <!-- Suggestion Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        <button class="suggestion-card p-6 bg-white dark:bg-gemini-surface rounded-[32px] text-left transition-all group flex flex-col justify-between h-56 border border-gray-100 dark:border-transparent shadow-sm">
                            <div>
                                <div class="w-12 h-12 rounded-2xl bg-blue-500/10 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                    <i class="fas fa-rocket text-blue-500 text-xl"></i>
                                </div>
                                <h3 class="font-bold text-lg mb-2">Ide Karir</h3>
                                <p class="text-sm text-gray-500 leading-relaxed">Berikan saya ide karir berdasarkan hobi saya.</p>
                            </div>
                            <i class="fas fa-arrow-right self-end opacity-0 group-hover:opacity-100 transition-all translate-x-4 group-hover:translate-x-0"></i>
                        </button>
                        
                        <button class="suggestion-card p-6 bg-white dark:bg-gemini-surface rounded-[32px] text-left transition-all group flex flex-col justify-between h-56 border border-gray-100 dark:border-transparent shadow-sm">
                            <div>
                                <div class="w-12 h-12 rounded-2xl bg-purple-500/10 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                    <i class="fas fa-wand-magic-sparkles text-purple-500 text-xl"></i>
                                </div>
                                <h3 class="font-bold text-lg mb-2">Tinjau CV</h3>
                                <p class="text-sm text-gray-500 leading-relaxed">Analisis CV saya untuk posisi Software Engineer.</p>
                            </div>
                            <i class="fas fa-arrow-right self-end opacity-0 group-hover:opacity-100 transition-all translate-x-4 group-hover:translate-x-0"></i>
                        </button>

                        <button class="suggestion-card p-6 bg-white dark:bg-gemini-surface rounded-[32px] text-left transition-all group flex flex-col justify-between h-56 border border-gray-100 dark:border-transparent shadow-sm">
                            <div>
                                <div class="w-12 h-12 rounded-2xl bg-red-500/10 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                                    <i class="fas fa-comments text-red-500 text-xl"></i>
                                </div>
                                <h3 class="font-bold text-lg mb-2">Wawancara</h3>
                                <p class="text-sm text-gray-500 leading-relaxed">Simulasikan wawancara untuk manajer produk.</p>
                            </div>
                            <i class="fas fa-arrow-right self-end opacity-0 group-hover:opacity-100 transition-all translate-x-4 group-hover:translate-x-0"></i>
                        </button>
                    </div>
                </div>

                <!-- Chat Messages List -->
                <div id="messages-list" class="max-w-4xl mx-auto space-y-12 mt-8 hidden"></div>
            </div>

            <!-- Chat Input Area -->
            <div class="absolute bottom-0 left-0 w-full pb-6 px-4 md:px-0 bg-gradient-to-t from-gemini-lightBg dark:from-gemini-bg via-gemini-lightBg dark:via-gemini-bg to-transparent pt-10">
                <div class="max-w-4xl mx-auto relative">
                    <div id="input-aura" class="absolute inset-0 bg-blue-500/10 dark:bg-blue-500/20 blur-[60px] rounded-full opacity-0 transition-opacity duration-1000"></div>
                    
                    <div class="bg-gray-100/50 dark:bg-[#1e1f20] rounded-[32px] p-1.5 relative z-10 transition-all duration-300">
                        <div class="flex flex-col">
                            <textarea id="user-input" rows="1" placeholder="Masukkan prompt di sini..." class="w-full bg-transparent outline-none focus:outline-none border-none focus:ring-0 px-6 py-4 resize-none max-h-64 text-[16px] text-gray-800 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 no-scrollbar" style="min-height: 56px;"></textarea>
                            
                            <div class="flex items-center justify-between px-3 pb-2 pt-1">
                                <div class="flex items-center gap-2">
                                    <!-- Upload Dropdown -->
                                    <div class="relative group">
                                        <button class="p-2 hover:bg-gray-200 dark:hover:bg-[#2a2b2c] rounded-full transition-all text-gray-600 dark:text-gray-400 flex items-center justify-center w-10 h-10" title="Upload Media">
                                            <i class="fas fa-plus text-lg"></i>
                                        </button>
                                        <div class="absolute bottom-full left-0 mb-2 hidden group-hover:block bg-white dark:bg-[#1e1f20] border border-gray-100 dark:border-gemini-border rounded-2xl shadow-xl p-2 min-w-[160px] z-50">
                                            <button class="w-full text-left px-4 py-2 hover:bg-gray-50 dark:hover:bg-[#2a2b2c] rounded-xl text-sm flex items-center gap-3 text-gray-700 dark:text-gray-300"><i class="far fa-image text-blue-500"></i> Gambar</button>
                                            <button class="w-full text-left px-4 py-2 hover:bg-gray-50 dark:hover:bg-[#2a2b2c] rounded-xl text-sm flex items-center gap-3 text-gray-700 dark:text-gray-300"><i class="far fa-file-alt text-purple-500"></i> Dokumen</button>
                                            <button class="w-full text-left px-4 py-2 hover:bg-gray-50 dark:hover:bg-[#2a2b2c] rounded-xl text-sm flex items-center gap-3 text-gray-700 dark:text-gray-300"><i class="fas fa-headphones text-red-500"></i> Audio</button>
                                        </div>
                                    </div>
                                    
                                    <button id="voice-btn" class="p-2 hover:bg-gray-200 dark:hover:bg-[#2a2b2c] rounded-full transition-all relative text-gray-600 dark:text-gray-400 flex items-center justify-center w-10 h-10" title="Voice Input">
                                        <i class="fas fa-microphone text-lg"></i>
                                        <div id="voice-wave" class="hidden absolute inset-0 flex items-center justify-center gap-0.5">
                                            <span class="w-1 h-3 bg-red-400"></span>
                                            <span class="w-1 h-5 bg-red-400"></span>
                                            <span class="w-1 h-2 bg-red-400"></span>
                                        </div>
                                    </button>

                                    <!-- Model Selector Dropdown -->
                                    <div class="relative flex items-center bg-gray-200/50 dark:bg-[#131314] hover:bg-gray-300/50 dark:hover:bg-black/40 rounded-xl px-3 py-1.5 cursor-pointer transition-colors group ml-1">
                                        <select id="model-select" class="bg-transparent text-[13px] text-gray-700 dark:text-gray-300 border-none outline-none focus:outline-none focus:ring-0 cursor-pointer appearance-none pr-6 font-medium">
                                            <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                                            <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                                            <option value="gemini-audio">Gemini Audio</option>
                                        </select>
                                        <i class="fas fa-chevron-down absolute right-3 text-[10px] text-gray-500 dark:text-gray-400 pointer-events-none transition-transform group-hover:translate-y-[1px]"></i>
                                    </div>

                                <button id="send-btn" class="w-10 h-10 flex items-center justify-center text-gray-400 bg-black/5 dark:bg-white/5 hover:text-blue-500 dark:hover:text-white disabled:opacity-30 transition-all rounded-full" disabled>
                                    <i class="fas fa-arrow-up"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-[1000] p-4">
        <div class="bg-white dark:bg-gemini-sidebar p-8 rounded-[32px] w-full max-w-lg shadow-2xl">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-bold google-sans">Setelan</h2>
                <button id="close-settings" class="p-2 hover:bg-black/5 dark:hover:bg-white/5 rounded-full transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="space-y-6 mb-8">
                <div class="flex items-center justify-between p-4 bg-gray-50 dark:bg-gemini-surface rounded-2xl">
                    <span class="font-medium">Mode Gelap</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggle-dark" checked class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>
            </div>
            
            <button id="save-settings" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg hover:bg-blue-700 transition-all">
                Selesai
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
